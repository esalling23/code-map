# Publishes to npm. Run it by hand (Actions → Publish → Run workflow) on main with a bump. It commits the next
# version and tags it, publishes only if that commit succeeded, and pushes the commit and the vX.Y.Z tag to
# main only if npm accepted the package. A failure at any point leaves main and npm as they were.
# It uses npm trusted publishing (OIDC), so no token is stored: the package's settings on npmjs.com name this
# repo and workflow. npm's own CLI publishes because trusted publishing needs it (npm 11.5.1 or later).
# After publishing it deploys the hosted viewer from the same commit, so the viewer always matches the latest
# release on npm. (pages.yml can deploy it by hand between releases.)
name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: echo "Run this workflow on main." && exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          version=$(jq -r .version package.json)
          if npm view "$(jq -r .name package.json)@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      # Local only until npm accepts the package.
      - name: Commit and tag the version
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: npm publish

      - name: Push the release to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "v$VERSION"

  viewer:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:viewer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-viewer:
    needs: viewer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
