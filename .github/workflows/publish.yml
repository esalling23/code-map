# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm trusted publishing (OIDC), so no token
# is stored: the package's settings on npmjs.com must name this repo and workflow as its trusted publisher.
# npm's own CLI does the publish because trusted publishing needs it (npm 11.5.1 or later).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: npm publish
