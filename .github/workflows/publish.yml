# Publishes to npm, two ways:
# - Run it by hand (Actions → Publish → Run workflow) on main with a bump: it sets the next version, publishes,
#   then commits the version to main and pushes the vX.Y.Z tag.
# - Push a tag (git tag v1.2.3 && git push origin v1.2.3): the tag is the version; it publishes, then commits
#   that version to main.
# It uses npm trusted publishing (OIDC), so no token is stored: the package's settings on npmjs.com name this
# repo and workflow. npm's own CLI publishes because trusted publishing needs it (npm 11.5.1 or later).
# Tags pushed here use GITHUB_TOKEN, which doesn't start workflows, so a release never triggers a second one.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main when run by hand
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "Run this workflow on main." && exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            npm version "$BUMP" --no-git-tag-version
          else
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          version=$(jq -r .version package.json)
          if npm view "$(jq -r .name package.json)@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm." && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: npm publish

      - name: Record the version on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git commit -am "chore(release): v$VERSION"
            git tag "v$VERSION"
            git push origin HEAD:main "v$VERSION"
          else
            git checkout -- package.json
            git checkout main
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            if ! git diff --quiet package.json; then
              git commit -am "chore(release): v$VERSION"
              git push origin main
            fi
          fi
